<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Insight Academy — математика, 1–12 класс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1927A1; --gold:#FABC1D; --red:#E4003D; --teal:#1BA4B0; --navy:#22235C;
    --ink:#2a2d52; --paper:#fbfaff; --card:#fff; --soft:#eef1ff; --line:#e6e3f3; --muted:#6b6e94;
    --green:#1f9d63;
    --shadow:0 8px 22px -12px rgba(34,35,92,.30);
    --fd:'Roboto','Segoe UI',system-ui,Arial,sans-serif;
    --mo:'Roboto Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--fd);color:var(--ink);
    background:radial-gradient(820px 520px at 12% -8%, rgba(250,188,29,.16), transparent 60%),
      radial-gradient(720px 540px at 100% 0%, rgba(27,164,176,.16), transparent 58%), var(--paper);
    min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px 110px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .logo img{display:block;height:44px;width:auto}
  .logo small{display:block;font-weight:700;font-size:10.5px;letter-spacing:2px;color:var(--navy);text-transform:uppercase;margin-top:4px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  h1.title{font-size:25px;color:var(--navy);margin-bottom:3px;letter-spacing:-.2px}
  .sub{color:var(--muted);font-weight:500;font-size:14.5px;margin-bottom:18px;max-width:74ch}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:20px;color:var(--navy)}
  .card .lead{color:var(--muted);font-weight:500;font-size:14px;margin-top:4px}
  .rbtn{cursor:pointer;border:none;background:var(--blue);color:#fff;font-weight:500;font-size:14.5px;padding:9px 17px;border-radius:12px}
  .rbtn:hover{filter:brightness(1.09)}
  .rbtn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
  .rbtn.teal{background:var(--teal)}.rbtn.gold{background:var(--gold);color:var(--navy)}
  .rbtn.sm{font-size:13px;padding:6px 12px;border-radius:10px}
  .fld{margin-bottom:13px}
  .fld > label{display:block;font-weight:700;font-size:14px;color:var(--navy);margin-bottom:5px}
  .fld .hint{color:var(--muted);font-weight:500;font-size:12.5px;margin-bottom:6px}
  input[type=text],input[type=date],textarea{width:100%;font-family:var(--fd);font-weight:500;font-size:15px;
    border:2px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;color:var(--ink);outline:none}
  input:focus,textarea:focus{border-color:var(--teal)}
  textarea{min-height:90px;resize:vertical;line-height:1.5}
  .grid2{display:flex;flex-wrap:wrap;gap:14px}
  .grid2 > *{flex:1 1 250px;min-width:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:13px;padding:6px 13px;border-radius:999px}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip.teal.on{background:var(--teal);border-color:var(--teal)}
  .chip.gold.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  /* student tabs */
  .stabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .stab{cursor:pointer;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 16px;font-weight:700;font-size:14.5px;color:var(--navy)}
  .stab:hover{border-color:var(--teal)}
  .stab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .stab .n{display:block;font-weight:500;font-size:11.5px;opacity:.7}
  /* checklist */
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:500;color:var(--muted);margin:10px 0}
  .legend b{font-family:var(--mo);color:var(--ink)}
  .tgroup{margin-top:16px}
  .tgroup > .gh{font-weight:700;font-size:13.5px;color:var(--blue);margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid var(--soft)}
  .trow{display:flex;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .trow .tn{flex:1 1 240px;font-weight:500;font-size:14.5px}
  .trow.k2{background:#f3fbf7}.trow.k1{background:#fffbf0}.trow.k0{background:#fdf1f4}
  .pts{display:flex;gap:5px}
  .pt{cursor:pointer;border:2px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;
    min-width:38px;height:32px;border-radius:9px;font-family:var(--mo);padding:0 7px}
  .pt:hover{border-color:var(--teal)}
  .pt.on[data-p="2"]{background:var(--green);border-color:var(--green);color:#fff}
  .pt.on[data-p="1"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  .pt.on[data-p="0"]{background:var(--red);border-color:var(--red);color:#fff}
  .pt.on[data-p=""]{background:var(--muted);border-color:var(--muted);color:#fff}
  .sum{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .sum > div{flex:1 1 150px;text-align:center;border-radius:14px;padding:12px 10px;background:var(--soft)}
  .sum .v{font-weight:900;font-size:26px;line-height:1}
  .sum .l{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:4px}
  .sum .g2 .v{color:var(--green)}.sum .g1 .v{color:#b07d00}.sum .g0 .v{color:var(--red)}
  .note{background:var(--soft);border-radius:12px;padding:11px 14px;font-weight:500;font-size:13.5px;margin:10px 0}
  .note.gold{background:#fff7e3;border-left:4px solid var(--gold)}
  .clscard{border:2px solid var(--blue);background:linear-gradient(180deg,#f4f6ff,#fff)}
  .clscard > h2{color:var(--blue)}
  .clsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .clsbtn{cursor:pointer;min-width:54px;height:48px;padding:0 10px;border:2px solid var(--line);
    background:#fff;border-radius:15px;font-family:inherit;font-weight:700;font-size:17px;color:var(--navy)}
  .clsbtn:hover{border-color:var(--teal)}
  .clsbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(25,39,161,.28)}
  .clsnow{display:inline-block;margin-top:12px;background:var(--gold);color:var(--navy);
    font-weight:700;font-size:13.5px;padding:6px 14px;border-radius:999px}
  .bar .now{font-weight:700;font-size:13px;color:#fff;background:var(--blue);
    padding:5px 12px;border-radius:999px;margin-right:12px}
  .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .plan{margin-top:9px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfbff}
  .plan .plh{font-weight:700;font-size:12.5px;color:var(--blue);margin-bottom:7px}
  .plan button{display:block;width:100%;text-align:left;cursor:pointer;border:1px dashed var(--line);
    background:#fff;color:var(--ink);font-weight:500;font-size:13px;padding:8px 11px;border-radius:10px;
    margin-bottom:6px;line-height:1.45}
  .plan button:last-child{margin-bottom:0}
  .plan button:hover{border-style:solid;border-color:var(--teal)}
  .plan .empty{font-size:12.5px;color:var(--muted);font-weight:500}
  .ph button{cursor:pointer;border:1px dashed var(--line);background:#fbfbff;color:var(--muted);
    font-weight:500;font-size:12.5px;padding:5px 11px;border-radius:999px;text-align:left;line-height:1.3}
  .ph button:hover{border-style:solid;border-color:var(--teal);color:var(--ink);background:#fff}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,255,.96);border-top:2px solid var(--line);padding:10px 18px;z-index:40}
  .bar-in{max-width:1000px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bar .mid{font-weight:500;font-size:13px;color:var(--muted);margin:0 auto}
  .hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);font-weight:500;font-size:14px}
  .hrow:first-of-type{border-top:0}
  .hrow .ha{margin-left:auto;display:flex;gap:6px}
  .mini{font-family:var(--mo);font-size:12.5px;color:var(--muted)}
  #doc{display:none}
  @media print{
    body{background:#fff}
    .wrap,.bar{display:none!important}
    #doc{display:block}
    @page{size:A4;margin:12mm 11mm}
  }
</style>
</head>

  h += '<h2>'+esc(t.res)+'</h2>';
  [['before', t.before], ['prog', t.grade]].forEach(function(pair){
    var b = c[pair[0]];
    if (!b.k2.length && !b.k1.length && !b.k0.length) return;
    h += '<h3>'+esc(pair[1])+'</h3><table>';
    if (b.k0.length) h += '<tr><th class="c0" style="width:27%">'+esc(t.gaps)+'</th><td>'+esc(b.k0.join(' · '))+'</td></tr>';
    if (b.k1.length) h += '<tr><th class="c1">'+esc(t.revise)+'</th><td>'+esc(b.k1.join(' · '))+'</td></tr>';
    if (b.k2.length) h += '<tr><th class="c2">'+esc(t.knows)+'</th><td>'+esc(b.k2.join(' · '))+'</td></tr>';
    if (b.none) h += '<tr><th>'+esc(t.notch)+'</th><td>'+b.none+' / '+b.total+'</td></tr>';
    h += '</table>';
  });

  var recs = [[t.fmt, optOut(s.fmtc)], [t.fmtw, s.fmt_why], [t.strong, s.strong]]
    .filter(function(r){ return r[1]; });
  if (recs.length) h += '<h2>'+esc(t.recs)+'</h2><table>' +
    recs.map(function(r){ return '<tr><th style="width:27%">'+esc(r[0])+'</th><td class="q">'+nl2br(r[1])+'</td></tr>'; }).join('') + '</table>';

  var goals = (s.goals || []).map(optOut);
  if (s.goals_other) goals.push(s.goals_other);
  var pgoals = (s.pgoals || []).map(optOut);
  if (s.pgoals_other) pgoals.push(s.pgoals_other);
  var intake = [[t.aFeel, optOut(s.feel)], [t.aWhen, s.when],
                [t.aMark, optOut(s.mark)], [t.aExam, optOut(s.exam)],
                [t.aGoals, goals.join(', ')], [t.aPGoals, pgoals.join(', ')],
                [t.aTime, optOut(s.time)]]
    .filter(function(r){ return r[1]; });
  if (intake.length) h += '<h2>'+esc(t.about)+'</h2><table>' +
    intake.map(function(r){ return '<tr><th style="width:27%">'+esc(r[0])+'</th><td class="q">'+nl2br(r[1])+'</td></tr>'; }).join('') + '</table>';
  h += '<p class="foot">'+esc(t.foot)+'</p></div>';
  return h;
}
var PCSS = "#doc{-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#222;font-family:Roboto,Segoe UI,Arial,sans-serif}"+
  "#doc .dlogo{height:24pt;width:auto;margin-bottom:9pt}"+
  "#doc h1{font-size:19pt;font-weight:700;color:#22235C;margin:0 0 3pt}"+
  "#doc .meta{font-size:8.5pt;color:#6b6e94;font-weight:500;margin-bottom:3pt}"+
  "#doc h2{font-size:11.5pt;color:#1927A1;text-transform:uppercase;letter-spacing:.5pt;margin:14pt 0 6pt}"+
  "#doc h3{font-size:10pt;color:#22235C;margin:9pt 0 4pt}"+
  "#doc table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:4pt}"+
  "#doc td,#doc th{border:1px solid #c9c6de;padding:5pt 7pt;text-align:left;vertical-align:top}"+
  "#doc th{background:#eef1ff;font-weight:700}"+
  "#doc th.c0{background:#fdecf0;color:#a3002c}#doc th.c1{background:#fff6e0;color:#8a6200}#doc th.c2{background:#eafaf1;color:#146c44}"+
  "#doc p.q{white-space:pre-wrap;font-size:10pt;margin-bottom:6pt}"+
  "#doc .foot{margin-top:16pt;font-size:8pt;color:#9a9aa8}"+
  "#doc a{color:#1927A1}";
(function(){ var st = document.createElement('style'); st.textContent = '@media print{' + PCSS + '}'; document.head.appendChild(st); })();
function buildDoc(){ $('#doc').innerHTML = docBody(); }
function docFile(){
  return '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'+
    '<head><meta charset="utf-8"><title>'+esc((S.st[S.cur]||{}).name||'Nexus')+'</title><style>'+
    'body{margin:0}'+PCSS+'@page{size:A4;margin:12mm 11mm}</style></head><body><div id="doc">'+docBody()+'</div></body></html>';
}
function fname(ext){
  var n = ((S.st[S.cur]||{}).name || 'report').replace(/[^\wА-Яа-яЁё\- ]/g,'').trim().replace(/\s+/g,'_');
  return 'Math' + S.cls + '_' + n + '_' + (S.date || '') + '.' + ext;
}
function dl(name, mime, text){
  var b = new Blob(['\ufeff'+text], {type:mime}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}
function status(m){ txt('status', m); setTimeout(function(){ txt('status', U().autosave); }, 2500); }

/* ================= storage ================= */
var LS = (function(){
  var ok = false;
  try { localStorage.setItem('__n','1'); localStorage.removeItem('__n'); ok = true; } catch(e){}
  var mem = {};
  return {ok:ok,
    get:function(k){ try { return ok ? localStorage.getItem(k) : mem[k]; } catch(e){ return mem[k]; } },
    set:function(k,v){ try { if (ok) localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } },
    del:function(k){ try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch(e){ delete mem[k]; } }};
})();
var DKEY='nexus_math_draft', HKEY='nexus_math_history', tmr=null;
function save(){ clearTimeout(tmr); tmr = setTimeout(function(){ LS.set(DKEY, JSON.stringify(S)); }, 500); }
function hist(){ try { return JSON.parse(LS.get(HKEY) || '[]'); } catch(e){ return []; } }
function saveHist(){
  var list = hist(), names = [];
  for (var i = 0; i < S.count; i++) names.push(stName(i));
  var e = {id:S.__id || String(Date.now()), name:names.join(' · '), date:S.date || '',
           teacher:S.teacher || '', cls:S.cls, data:S};
  S.__id = e.id;
  var at = -1;
  list.forEach(function(x,i){ if (x.id === e.id) at = i; });
  if (at >= 0) list[at] = e; else list.unshift(e);
  LS.set(HKEY, JSON.stringify(list.slice(0,80)));
  renderHist(); status(U().saved);
}
function renderHist(){
  var box = $('#histBox'), u = U();
  if (box.hidden) return;
  var list = hist();
  box.innerHTML = '<div class="card"><h2>'+esc(u.histT)+'</h2><p class="lead">'+(LS.ok ? esc(u.histP) : '<b>'+esc(u.histNo)+'</b>')+'</p>'+
    (list.length ? list.map(function(x){
      return '<div class="hrow"><span>'+esc(x.name)+'</span>'+
        '<span class="mini">'+(x.cls ? esc(u.cls)+' '+esc(x.cls) : '')+'</span>'+
        '<span class="mini">'+esc((x.date||'').split('-').reverse().join('.'))+
        '</span><span class="mini">'+esc(x.teacher||'')+'</span>'+
        '<span class="ha"><button class="rbtn ghost sm" data-open="'+x.id+'">'+esc(u.open)+'</button>'+
        '<button class="rbtn ghost sm" data-del="'+x.id+'">'+esc(u.del)+'</button></span></div>';
    }).join('') : '<p style="font-weight:500">'+esc(u.empty)+'</p>') + '</div>';
  $$('[data-open]', box).forEach(function(b){ b.onclick = function(){
    var x = hist().filter(function(y){ return y.id === b.getAttribute('data-open'); })[0];
    if (x){ S = x.data; if (!S.cls || !APP.cls[S.cls]) S.cls = '5'; applyClass();
      box.hidden = true; renderAll(); status(u.opened); } };});
  $$('[data-del]', box).forEach(function(b){ b.onclick = function(){
    LS.set(HKEY, JSON.stringify(hist().filter(function(y){ return y.id !== b.getAttribute('data-del'); })));
    renderHist(); };});
}

/* ================= init ================= */
function renderAll(){
  renderChrome(); renderTabs(); bindFields(); renderOpts(); renderLib(); renderTopics();
  renderSummary(); renderPlan();
}
(function(){
  var raw = LS.get(DKEY);
  if (raw){ try { var d = JSON.parse(raw); if (d && d.st) S = d; } catch(e){} }
  if (!S.st) S.st = [blank(), blank(), blank()];
  while (S.st.length < 3) S.st.push(blank());
  if (!S.date) S.date = new Date().toISOString().slice(0,10);
  if (!S.cls || !APP.cls[S.cls]) S.cls = '5';
  applyClass();
  renderAll();
})();
$('#btnPdf').onclick = $('#btnPdf2').onclick = function(){ buildDoc(); window.print(); };
$('#btnDoc').onclick = function(){ buildDoc(); saveHist(); dl(fname('doc'), 'application/msword', docFile()); };
$('#btnJson').onclick = $('#saveBtn').onclick = function(){ dl(fname('json'), 'application/json', JSON.stringify(S, null, 1)); };
$('#btnHist').onclick = saveHist;
$('#histBtn').onclick = function(){ var b = $('#histBox'); b.hidden = !b.hidden; renderHist(); };
$('#resetMarks').onclick = function(){ st().marks = {}; save(); renderTopics(); renderSummary(); renderPlan(); };
$('#clearBtn').onclick = function(){
  if (!confirm(U().confirm)) return;
  S = {ui:S.ui, lang:S.lang, cls:S.cls, count:S.count, cur:0, block:'before', teacher:S.teacher,
       date:new Date().toISOString().slice(0,10), st:[blank(), blank(), blank()]};
  LS.del(DKEY); renderAll(); status(U().newdone);
};
$('#loadFile').onchange = function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){ try { S = JSON.parse(r.result); if (!S.st) S.st = [blank(),blank(),blank()];
                             if (!S.cls || !APP.cls[S.cls]) S.cls = '5'; applyClass();
                             renderAll(); status(U().fileopen); }
                         catch(err){ status(U().fileerr); } };
  r.readAsText(f); e.target.value = '';
};
